plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vozlivre.client'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.vozlivre.client'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '0.10.2'
    }
}

dependencies {
    implementation project(':core')
}
